name: release

# A tag alone is not a release: it is a request for one. The archive is built
# when the release is published, so the artefact is only ever attached to a
# release somebody deliberately made.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build as, e.g. v0.4.0
        required: true
        default: v0.4.0

permissions:
  contents: write

jobs:
  archive:
    name: Build the release archive
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Every dependency is a submodule and the two undoRT forks have to be
          # present, or the editor has no source to compile. The archive itself
          # ships no build tree, so a shallow checkout is not enough here.
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ccache \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libglm-dev

      # Every compile in this job goes through ccache, including the ones the
      # test suites run themselves: they call g++ and gcc by name, so the
      # wrappers are found by PATH rather than configured per build system.
      #
      # The three builds are the whole cost of the job — the IDE, st2cpp and the
      # test suites' own objects — and between two releases almost none of that
      # changed, so a restored cache turns a ten minute run into the time it
      # takes to configure. The key is the commit, with a prefix to fall back on,
      # because ccache itself decides what is a hit: an older cache is worth
      # restoring and nothing is rebuilt that would not have been rebuilt anyway.
      - name: Restore the compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Put ccache in front of the compilers
        run: |
          set -eu
          mkdir -p "$HOME/ccache-bin"
          for compiler in cc c++ gcc g++; do
            ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$compiler"
          done
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Build the st2cpp command line
        # The editor shells out to this for the Compile button, so an archive
        # without it ships a button that reports it cannot find the transpiler.
        run: |
          cmake -S third_party/st2cpp -B build/st2cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/st2cpp -j"$(nproc)"

      - name: Report the cache
        if: always()
        run: ccache --show-stats || true

      - name: Test
        run: |
          ./src/core/tests/run_tests.sh
          ./undoApps/undoApp.Editor/tests/run_tests.sh
          ./undoApps/undoApp.Terminal/tests/run_tests.sh

      - name: Stage the tree
        env:
          VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          version="${VERSION#v}"
          root="undoStudio-$version"

          mkdir -p "$root/st2cpp"
          cp -a undoStudio libundoStudioCore.so plugins resources docs "$root/"
          cp -a build/st2cpp/st2cpp "$root/st2cpp/"

          cat > "$root/README.txt" <<EOF
          undoStudio $version

          Run it from this directory:

              ./undoStudio

          The root matters. Fonts, icons, themes and the shipped layout are
          opened as resources/... and the undoApps are loaded from plugins/,
          both relative to the working directory, so from anywhere else the IDE
          comes up without them.

          What is here:

            undoStudio            the IDE
            libundoStudioCore.so  the core library it links
            plugins/              the undoApps, loaded at start-up
            resources/            fonts, icons, themes, default layout
            st2cpp/st2cpp         the transpiler the Compile button invokes
            docs/                 the feature documentation, start at editor.md

          The documentation is here so it travels with the thing it describes.
          The pages are Markdown with a screenshot each, so the one to read first
          is docs/editor.md and the one to read when something is not what the
          page says is docs/testing.md, which is honest about what has never been
          seen running.

          System packages still have to be on the machine: the X11 and OpenGL
          development libraries GLFW builds against, and glm. They are in the
          README under "System packages".
          EOF

      - name: Check the staged tree
        env:
          VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          root="undoStudio-${VERSION#v}"

          # The archive has to run from where it was unpacked, which means the
          # library has to resolve through $ORIGIN and the resources and the
          # undoApps have to sit beside the binary.
          ldd "$root/undoStudio" | grep -q "not found" && {
            echo "undoStudio does not resolve its libraries in the staged tree"; exit 1; }
          ldd "$root/plugins/undoApp.Editor.so" | grep -q "not found" && {
            echo "undoApp.Editor does not resolve its libraries in the staged tree"; exit 1; }

          for required in \
            "$root/undoStudio" \
            "$root/libundoStudioCore.so" \
            "$root/plugins/undoApp.Editor.so" \
            "$root/plugins/undoApp.Terminal.so" \
            "$root/resources/undoStudio_layout.ini" \
            "$root/resources/fonts" \
            "$root/resources/icons" \
            "$root/resources/themes" \
            "$root/docs" \
            "$root/docs/editor.md" \
            "$root/docs/images" \
            "$root/st2cpp/st2cpp"
          do
            [ -e "$required" ] || { echo "missing from the archive: $required"; exit 1; }
          done

          test -x "$root/st2cpp/st2cpp" || { echo "the st2cpp CLI is not executable"; exit 1; }

          # No state file may go into the archive.
          #
          # undoStudio.ini is written at run time and holds the recent projects and
          # the last window size. Shipping one means shipping somebody's home
          # directory in the recent list, on a machine where every one of those
          # paths is dead, and a window sized to a screen that is not there. It is
          # ignored in the repository, so the copy that gets staged is the one
          # written by whatever ran the tests just before this job, and that is
          # exactly the one that must not ship.
          for state in undoStudio.ini undoStudio_layout.ini imgui.ini \
                      undoApp.Editor.ini undoApp.Terminal.ini
          do
            [ -e "$root/$state" ] && {
              echo "a run-time state file would ship: $state"; exit 1; }
          done

          # What the IDE falls back on when there is no state file: the shipped
          # layout, and the window size in the struct it has always used. Both are
          # checked so that a change to either is a deliberate one.
          grep -q "\[Window\]\[DockSpace\]" "$root/resources/undoStudio_layout.ini" || {
            echo "the shipped layout has no dockspace"; exit 1; }
          ! grep -qE "^project=|^\[recent\]" "$root/resources/undoStudio_layout.ini" || {
            echo "the shipped layout carries a recent-projects list"; exit 1; }

          echo "staged tree is complete"

      - name: Archive
        env:
          VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          version="${VERSION#v}"
          tar -czf "undoStudio-$version-linux-x86_64.tar.gz" "undoStudio-$version"
          sha256sum "undoStudio-$version-linux-x86_64.tar.gz" > "undoStudio-$version-linux-x86_64.tar.gz.sha256"
          cat "undoStudio-$version-linux-x86_64.tar.gz.sha256"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          archive="undoStudio-$version-linux-x86_64.tar.gz"

          # One file at a time, and retried, because the two together were not
          # reliable: v0.1.2 published with the checksum attached and the
          # archive missing, the upload of the archive answered 403 while the
          # 103-byte one beside it succeeded, and `gh release upload` sends them
          # concurrently. The retry covers a refusal that is not about the
          # permission, which is what the token has and always had.
          for attempt in 1 2 3 4 5; do
            missing=0
            for file in "$archive" "$archive.sha256"; do
              if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                echo "attached $file"
              else
                echo "upload of $file failed (attempt $attempt)"
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then break; fi
            sleep $((attempt * 10))
          done

          # The archive is what somebody downloads, so its absence has to fail
          # the job rather than leave a release that looks finished and is not.
          attached="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for file in "$archive" "$archive.sha256"; do
            grep -qxF "$file" <<<"$attached" || {
              echo "the release does not carry $file"; echo "$attached"; exit 1; }
          done
          echo "the release carries:"; echo "$attached"
